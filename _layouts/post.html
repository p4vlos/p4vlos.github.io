---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="post-back"><a href="{{ '/' | relative_url }}">← back home</a></p>
</article>
